specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: GatiFlow
providerId: gatiflow
created: '2026-09-27'
# Authored by API Evangelist from GatiFlow's public pricing (https://gatiflow.io, Pricing
# section) at the provider's request (Rege, 2026-09-27). Not harvested: GatiFlow publishes
# no FinOps/FOCUS document of its own.
method: authored
modified: '2026-09-27'
tags:
- Market Intelligence
- Developer Signals
- FinOps
- FOCUS
description: >-
  FOCUS-aligned FinOps profile for GatiFlow. Flat monthly subscriptions in USD across three
  paid tiers (Starter, Pro, Business) with a 14-day free trial on Starter; after the trial an
  account falls back to a free read-only tier at no charge. API access is metered per API key
  and reported through GatiFlow's own usage endpoint.
sources:
- https://gatiflow.io/
- https://gatiflow.io/api-docs
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: GatiFlow
serviceCategory: Analytics
billingModel:
  pricingCategory: Commitment (Subscription)
  billingFrequency: Monthly
  billingCurrency: USD
  freeTier: Free read-only tier after the 14-day Starter trial
  chargeCategories:
  - Purchase
plans:
- name: Free (read-only)
  price: 0
  currency: USD
  period: month
  note: The tier an account falls back to after the trial.
- name: Starter
  price: 49
  currency: USD
  period: month
  trial: 14-day free trial
- name: Pro
  price: 149
  currency: USD
  period: month
  note: Marked "Most Popular"; signal alerts by webhook ship from Pro up.
- name: Business
  price: 499
  currency: USD
  period: month
focusColumns:
  ServiceName: GatiFlow Intelligence API
  ServiceCategory: Analytics
  ProviderName: GatiFlow
  PublisherName: GatiFlow
  InvoiceIssuerName: GatiFlow
  BillingCurrency: USD
  ChargeCategory: Purchase
  PricingCategory: Commitment
meters:
- name: api_requests
  description: API requests per API key (gf_ prefix, X-API-Key header), reported by GatiFlow's usage endpoint.
  unit: requests
  aggregation: sum
  dimensions: [api_key, organization, endpoint]
principles:
- name: Visibility
  description: Read per-key request counts from GatiFlow's usage endpoint to track consumption against the plan.
- name: Allocation
  description: Issue one API key per team or workload to attribute usage inside an organization.
- name: Optimization
  description: Choose the tier by webhook and volume needs; alerts by webhook start at Pro.
- name: Accountability
  description: Plan changes and price changes carry at least thirty days' written notice (GatiFlow terms, section 7.7).
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
