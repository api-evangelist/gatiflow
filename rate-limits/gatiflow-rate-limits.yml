name: GatiFlow Intelligence API rate limits
description: >-
  Per-plan request-rate and daily-quota limits. Both a per-minute rate limit and a
  daily quota apply; they are surfaced in X-RateLimit-* and X-DailyQuota-* response
  headers. The intelligence report and export operations return both header
  families; report-history and point-in-time snapshot operations return
  X-RateLimit-* only (rate limited, no quota consumed). The unauthenticated Deep
  Dive preview is capped per caller IP address and states its own ceiling. A stale
  intelligence report (older than 24 hours) returns 503 with Retry-After.
headers:
- X-RateLimit-Limit
- X-RateLimit-Remaining
- X-RateLimit-Reset
- X-DailyQuota-Limit
- X-DailyQuota-Remaining
- Retry-After
