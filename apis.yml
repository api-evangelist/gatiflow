apis:
- aid: gatiflow:gatiflow-intelligence-api
  name: GatiFlow Intelligence API
  description: A read-only JSON API over the GatiFlow signal pipeline. Seven published operations return
    the current intelligence report (content scales with plan), its retained snapshots, a point-in-time
    snapshot by id, a CSV/PDF file export (CSV on Pro, CSV or PDF on Business), the shared Daily Insights
    payload, the latest Deep Dive preview (the one operation needing no credential), and the calls made
    with an API key. Authentication is a gf_-prefixed API key in the X-API-Key header; a separate JWT
    session bearer is web-app only. Per-plan rate limits and daily quotas are surfaced in X-RateLimit-*
    and X-DailyQuota-* headers, and the report endpoint returns 503 with Retry-After rather than serving
    intelligence older than 24 hours. OpenAPI 3.1, version 2.2.0, served at gatiflow.io/openapi.json with
    servers[] https://api.gatiflow.io.
  humanURL: https://gatiflow.io/api-docs
