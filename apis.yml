aid: gatiflow
name: GatiFlow
description: GatiFlow is a market, talent and hiring intelligence product that turns public developer activity into
  structured signals and serves them as a read-only JSON API. Thirteen public sources — GitHub, StackOverflow, HackerNews,
  Dev.to, arXiv, OpenReview, npm, PyPI, HuggingFace, Adzuna, Remotive, job boards (Greenhouse and Lever public postings)
  and SEC EDGAR — are polled on a six-hour cycle; a trend-category signal is published only once two independent
  sources confirm it or one source repeats it across two collection cycles, confidence is computed from source authority,
  diversity and persistence rather than raw mention count, and every signal carries its evidence and week-over-week
  movement. The public GatiFlow Intelligence API exposes seven read-only operations (the current report, snapshot
  history, a point-in-time snapshot, a CSV/PDF export, the daily insights payload, the latest Deep Dive preview,
  and per-key usage), authenticated with a gf_-prefixed API key in the X-API-Key header, priced across Free, Starter
  ($49/mo), Pro ($149/mo) and Business ($499/mo) plans.
