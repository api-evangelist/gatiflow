name: GatiFlow Intelligence API lifecycle
versioning: 'The version is in the path: every published operation lives under /api/v1. Additive changes ship without
  notice: a new operation, a new optional parameter, a new field in a response. Clients should ignore fields they
  do not know. A breaking change (removing or renaming an operation, a parameter or a field, or changing its type
  or meaning) ships only under a new version path, next to the current one. The contract carries info.version 2.3.0;
  the hand-curated product changelog runs separately at v2.x (currently v2.10).'
deprecation:
  policy: An operation or a version is removed no sooner than 90 days after its deprecation is announced. The notice
    goes by email to the owner of every organization holding an active API key and into the changelog; the operation
    is marked deprecated in the contract; and from the day of the notice its responses carry a Deprecation header
    (RFC 9745) and a Sunset header (RFC 8594) with the removal date.
  url: https://gatiflow.io/api-docs#versioning
  notice_days: 90
  headers:
  - Deprecation (RFC 9745)
  - Sunset (RFC 8594)
  channels:
  - email to the owner of every organization holding an active API key
  - changelog
  - deprecated flag in the contract
  current: No operation is deprecated today.
