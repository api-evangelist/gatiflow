    DeepDivePreview:
      description: 'The opening of the latest Deep Dive, or ``status: no_article``.'
      properties:
        full_article_available:
          title: Full Article Available
          type: boolean
        id:
          title: Id
          type: string
        message:
          title: Message
          type: string
        preview:
          title: Preview
          type: string
        published_at:
          format: date-time
          title: Published At
          type: string
        status:
          enum:
          - ok
          - no_article
          title: Status
          type: string
        title:
          title: Title
          type: string
        topic:
          title: Topic
          type: string
        upgrade_message:
          title: Upgrade Message
          type: string
        word_count:
          title: Word Count
          type: integer
      required:
      - status
      title: DeepDivePreview
      type: object
    ErrorDetail:
      description: What went wrong, and the id to quote when asking about it.
      properties:
