          type: string
      required:
      - title
      - summary
      - narrative
      - overall_confidence
      title: ExecutiveSummary
      type: object
    InsightsCallToAction:
      properties:
        api_docs:
          title: Api Docs
          type: string
        message:
          title: Message
          type: string
        signup_url:
          title: Signup Url
          type: string
      required:
      - message
      - signup_url
      - api_docs
      title: InsightsCallToAction
      type: object
