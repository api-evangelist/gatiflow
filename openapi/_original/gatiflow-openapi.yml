webhooks:
  intelligence:alert:
    post:
      description: 'Sent to every active webhook of an organization on the Pro or Business plan when a collection cycle raises
        alerts that match its watchlist: a watched topic spiking or emerging, or a watched company appearing in the hiring
        feed for the first time. Alerts are raised while Signal Alerts is switched on in Settings, and one delivery carries
        every alert the cycle raised for the organization.


        Collection runs every six hours and delivery runs in the same cycle, right after the alerts are raised. A delivery
        that is not acknowledged is retried at each following cycle, up to five attempts, with the same X-GatiFlow-Delivery-Id;
        after the fifth failure the webhook is switched off and the organization owner is emailed. Ordering between deliveries
        is not guaranteed.


        Verify every request before acting on it: X-GatiFlow-Signature is t=<unix timestamp>,v1=<hex>, where <hex> is the
        HMAC-SHA256 of ''<timestamp>.<raw body>'' under the secret shown once when the webhook was created. See https://gatiflow.io/api-docs/webhooks.'
      operationId: intelligenceAlert
      parameters:
      - description: The event type, the same value as event in the body.
        in: header
        name: X-GatiFlow-Event
        required: true
        schema:
          enum:
          - intelligence:alert
          type: string
      - description: t=<unix timestamp>,v1=<HMAC-SHA256 hex of '<timestamp>.<raw body>' under the webhook secret>. Compare
          in constant time and reject a mismatch.
        in: header
        name: X-GatiFlow-Signature
        required: true
        schema:
          pattern: ^t=[0-9]+,v1=[0-9a-f]{64}$
          type: string
      - description: The t= value of the signature, on its own. It is fixed when the event is raised and travels unchanged
          through every retry.
        in: header
        name: X-GatiFlow-Timestamp
        required: true
        schema:
          type: integer
      - description: One id per logical delivery, repeated on every retry. Use it to discard duplicates.
        in: header
        name: X-GatiFlow-Delivery-Id
        required: true
        schema:
          format: uuid
          type: string
      - description: Which attempt this is, 1 to 5.
        in: header
        name: X-GatiFlow-Attempt
        required: true
        schema:
          maximum: 5
          minimum: 1
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertEvent'
        required: true
      responses:
        2XX:
          description: Acknowledged. Any status below 400 within 10 seconds counts as delivered; redirects are not followed.
        default:
          description: A 4xx or 5xx, a timeout or a refused connection is a failed attempt and is retried.
      summary: Alerts raised for the organization's watchlist
      tags:
      - webhooks
