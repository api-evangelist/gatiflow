components:
  schemas:
    AIGeneratedDeclaration:
      description: Which parts of the payload a language model wrote.
      properties:
        applies_to:
          items:
            type: string
          title: Applies To
          type: array
        model:
          title: Model
          type: string
        purpose:
          title: Purpose
          type: string
        regulation:
          title: Regulation
          type: string
      required:
      - applies_to
      - model
      - purpose
      title: AIGeneratedDeclaration
      type: object
    AlertData:
      properties:
        alert_count:
          minimum: 1.0
          title: Alert Count
          type: integer
        alerts:
          items:
            discriminator:
              mapping:
                emerging: '#/components/schemas/EmergingAlert'
                new_hirer: '#/components/schemas/NewHirerAlert'
                spike: '#/components/schemas/SpikeAlert'
              propertyName: type
            oneOf:
            - $ref: '#/components/schemas/SpikeAlert'
            - $ref: '#/components/schemas/EmergingAlert'
            - $ref: '#/components/schemas/NewHirerAlert'
          title: Alerts
          type: array
        generated_at:
          format: date-time
          title: Generated At
          type: string
      required:
      - alert_count
      - alerts
      - generated_at
      title: AlertData
      type: object
    AlertEvent:
      description: The body of every ``intelligence:alert`` delivery.
      properties:
        data:
          $ref: '#/components/schemas/AlertData'
        event:
          const: intelligence:alert
          title: Event
          type: string
      required:
      - event
      - data
      title: AlertEvent
      type: object
    ClientInfo:
      description: Who the report was built for and how much of today's quota is used.
      properties:
        client_name:
          title: Client Name
          type: string
        daily_limit:
          title: Daily Limit
          type: integer
        org_name:
          title: Org Name
          type: string
        plan:
          title: Plan
          type: string
        subscription_status:
          title: Subscription Status
          type: string
        trial_days_remaining:
          anyOf:
          - type: integer
          - type: 'null'
          title: Trial Days Remaining
        used_today:
          title: Used Today
          type: integer
      required:
      - client_name
      - org_name
      - plan
      - daily_limit
      - used_today
      title: ClientInfo
      type: object
    DailyInsights:
      description: The shared Daily Insights report, shaped to the caller's plan.
      properties:
        analytics:
          $ref: '#/components/schemas/ReportAnalytics'
        cta:
          $ref: '#/components/schemas/InsightsCallToAction'
        generated_at:
          format: date-time
          title: Generated At
          type: string
        metadata:
          $ref: '#/components/schemas/InsightsMetadata'
        score:
          $ref: '#/components/schemas/ReportScore'
        sections:
          $ref: '#/components/schemas/ReportSections'
        subtitle:
          title: Subtitle
          type: string
        title:
          title: Title
          type: string
        week_of:
          title: Week Of
          type: string
      required:
      - generated_at
      - week_of
      - title
      - subtitle
      - sections
      - score
      - analytics
      - cta
      - metadata
      title: DailyInsights
      type: object
    DeepDivePreview:
      description: 'The opening of the latest Deep Dive, or ``status: no_article``.'
      properties:
        full_article_available:
          title: Full Article Available
          type: boolean
        id:
          title: Id
          type: string
        message:
          title: Message
          type: string
        preview:
          title: Preview
          type: string
        published_at:
          format: date-time
          title: Published At
          type: string
        status:
          enum:
          - ok
          - no_article
          title: Status
          type: string
        title:
          title: Title
          type: string
        topic:
          title: Topic
          type: string
        upgrade_message:
          title: Upgrade Message
          type: string
        word_count:
          title: Word Count
          type: integer
      required:
      - status
      title: DeepDivePreview
      type: object
    EmergingAlert:
      description: A watched topic appeared, with no baseline to compare against yet.
      properties:
        current_mentions:
          title: Current Mentions
          type: integer
        sources:
          description: Number of independent sources that observed it.
          title: Sources
          type: integer
        topic:
          title: Topic
          type: string
        type:
          const: emerging
          title: Type
          type: string
      required:
      - type
      - topic
      - current_mentions
      - sources
      title: EmergingAlert
      type: object
    ErrorDetail:
      description: What went wrong, and the id to quote when asking about it.
      properties:
        code:
          description: NOT_FOUND for a 404, VALIDATION_ERROR for a 422, HTTP_ERROR for every other refusal.
          enum:
          - HTTP_ERROR
          - NOT_FOUND
          - VALIDATION_ERROR
          - INTERNAL_ERROR
          title: Code
          type: string
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - items:
              $ref: '#/components/schemas/ValidationIssue'
            type: array
          description: The list of problems on a 422; an empty object otherwise.
          title: Details
        http_status:
          title: Http Status
          type: integer
        message:
          description: Why the request was refused, in plain words.
          title: Message
          type: string
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          description: Also sent as the X-Request-ID response header.
          title: Request Id
      required:
      - message
      - code
      - http_status
      - request_id
      - details
      title: ErrorDetail
      type: object
    ErrorMetadata:
      properties:
        provider:
          title: Provider
          type: string
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        version:
          title: Version
          type: string
      required:
      - timestamp
      - provider
      - version
      title: ErrorMetadata
      type: object
    ErrorResponse:
      description: Every refusal the API returns, whatever its status.
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
        metadata:
          $ref: '#/components/schemas/ErrorMetadata'
        status:
          const: error
          title: Status
          type: string
      required:
      - status
      - error
      - metadata
      title: ErrorResponse
      type: object
    ExecutiveSummary:
      description: 'The report overview. ``narrative`` is written by a language model and

        declared as such in ``metadata.ai_generated``.'
      properties:
        narrative:
          title: Narrative
          type: string
        overall_confidence:
          title: Overall Confidence
          type: number
        summary:
          title: Summary
          type: string
        title:
          title: Title
          type: string
      required:
      - title
      - summary
      - narrative
      - overall_confidence
      title: ExecutiveSummary
      type: object
    InsightsCallToAction:
      properties:
        api_docs:
          title: Api Docs
          type: string
        message:
          title: Message
          type: string
        signup_url:
          title: Signup Url
          type: string
      required:
      - message
      - signup_url
      - api_docs
      title: InsightsCallToAction
      type: object
    InsightsMetadata:
      properties:
        data_sources:
          title: Data Sources
          type: string
        product:
          title: Product
          type: string
        report_type:
          title: Report Type
          type: string
        update_frequency:
          title: Update Frequency
          type: string
      required:
      - product
      - data_sources
      - update_frequency
      - report_type
      title: InsightsMetadata
      type: object
    IntelligenceReport:
      description: 'The intelligence report for the calling organization.


        The same shape is served for an archived snapshot, which carries no

        ``client_info`` because it was built by the collection cycle rather than

        for a caller.'
      properties:
        analytics:
          $ref: '#/components/schemas/ReportAnalytics'
        client_info:
          $ref: '#/components/schemas/ClientInfo'
        contract:
          $ref: '#/components/schemas/ReportContract'
        generated_at:
          format: date-time
          title: Generated At
          type: string
        metadata:
          $ref: '#/components/schemas/ReportMetadata'
        org_id:
          title: Org Id
          type: string
        plan:
          title: Plan
          type: string
        schema_version:
          description: The contract shape this payload follows, 1.0 or 1.2.
          title: Schema Version
          type: string
        score:
          $ref: '#/components/schemas/ReportScore'
        sections:
          $ref: '#/components/schemas/ReportSections'
        trend_analysis:
          $ref: '#/components/schemas/TrendAnalysis'
      required:
      - schema_version
      - org_id
      - plan
      - generated_at
      - contract
      - metadata
      - score
      - sections
      - analytics
      title: IntelligenceReport
      type: object
    MarketOverview:
      properties:
        average_score:
          title: Average Score
          type: number
        top_score:
          title: Top Score
          type: number
        total_profiles_analyzed:
          title: Total Profiles Analyzed
          type: integer
      required:
      - total_profiles_analyzed
      - average_score
      - top_score
      title: MarketOverview
      type: object
    NewHirerAlert:
      description: A watched company appeared in the hiring feed for the first time.
      properties:
        company:
          title: Company
          type: string
        source:
          title: Source
          type: string
        title:
          title: Title
          type: string
        type:
          const: new_hirer
          title: Type
          type: string
      required:
      - type
      - company
      - title
      - source
      title: NewHirerAlert
      type: object
    OrgBriefing:
      description: 'Business plan only: a paragraph on the organization''s own watchlist.'
      properties:
        narrative:
          title: Narrative
          type: string
        title:
          title: Title
          type: string
      required:
      - title
      - narrative
      title: OrgBriefing
      type: object
    ReportAnalytics:
      description: Distributions over the talent profiles in the report.
      properties:
        market_overview:
          $ref: '#/components/schemas/MarketOverview'
        role_distribution:
          additionalProperties:
            type: integer
          title: Role Distribution
          type: object
        seniority_distribution:
          additionalProperties:
            type: integer
          description: Profiles per score band.
          title: Seniority Distribution
          type: object
        seniority_levels:
          additionalProperties:
            type: integer
          description: Profiles per seniority label.
          title: Seniority Levels
          type: object
        stack_distribution:
          additionalProperties:
            type: integer
          title: Stack Distribution
          type: object
        strategic_insights:
          items:
            type: string
          title: Strategic Insights
          type: array
      required:
      - market_overview
      - seniority_distribution
      - seniority_levels
      - stack_distribution
      - role_distribution
      - strategic_insights
      title: ReportAnalytics
      type: object
    ReportCapabilities:
      properties:
        exports:
          description: Export formats the plan includes.
          items:
            enum:
            - csv
            - pdf
            type: string
          title: Exports
          type: array
        org_briefing:
          title: Org Briefing
          type: boolean
        show_confidence:
          title: Show Confidence
          type: boolean
        show_evidence:
          title: Show Evidence
          type: boolean
      required:
      - exports
      - show_evidence
      - show_confidence
      - org_briefing
      title: ReportCapabilities
      type: object
    ReportContract:
      description: 'What the plan entitles the caller to. Schema 1.0, the default, carries

        the first three fields only; 1.1 and 1.2 add capabilities and limits.'
      properties:
        capabilities:
          $ref: '#/components/schemas/ReportCapabilities'
        limits:
          $ref: '#/components/schemas/ReportLimits'
        plan_level:
          title: Plan Level
          type: string
        report_type:
          title: Report Type
          type: string
        schema_version:
          title: Schema Version
          type: string
      required:
      - schema_version
      - plan_level
      - report_type
      title: ReportContract
      type: object
    ReportHistory:
      description: Retained snapshots, newest first.
      properties:
        count:
          title: Count
          type: integer
        plan:
          title: Plan
          type: string
        retention_days:
          minimum: 0.0
          title: Retention Days
          type: integer
        snapshots:
          items:
            $ref: '#/components/schemas/SnapshotSummary'
          title: Snapshots
          type: array
      required:
      - snapshots
      - count
      - plan
      - retention_days
      title: ReportHistory
      type: object
    ReportLimits:
      properties:
        max_signals:
          title: Max Signals
          type: integer
        max_talents:
          title: Max Talents
          type: integer
        max_trends:
          title: Max Trends
          type: integer
        profile_companies:
          title: Profile Companies
          type: integer
        profile_topics:
          title: Profile Topics
          type: integer
      required:
      - max_trends
      - max_talents
      - max_signals
      title: ReportLimits
      type: object
    ReportMetadata:
      description: 'Provenance of the report: when it was built, from what, and how fresh

        the underlying data is.'
      properties:
        ai_generated:
          $ref: '#/components/schemas/AIGeneratedDeclaration'
        collection_health:
          additionalProperties: true
          title: Collection Health
          type: object
        confidentiality:
          title: Confidentiality
          type: string
        corroboration_gate:
          enum:
          - active
          - inactive
          title: Corroboration Gate
          type: string
        data_age_hours:
          title: Data Age Hours
          type: number
        data_collected_at:
          title: Data Collected At
          type: string
        data_source:
          title: Data Source
          type: string
        generated_at:
          format: date-time
          title: Generated At
          type: string
        narrative_credits:
          additionalProperties: true
          title: Narrative Credits
          type: object
        narrative_exhausted:
          title: Narrative Exhausted
          type: boolean
        product:
          title: Product
          type: string
        quality:
          additionalProperties: true
          title: Quality
          type: object
        raw_observations_held:
          title: Raw Observations Held
          type: integer
        relevance_ranking:
          enum:
          - active
          - neutral
          title: Relevance Ranking
          type: string
        report_version:
          title: Report Version
          type: string
        staleness_warning:
          title: Staleness Warning
          type: string
        watermark:
          description: Present on the expired-trial preview only.
          title: Watermark
          type: string
      required:
      - generated_at
      - product
      - report_version
      - confidentiality
      - ai_generated
      title: ReportMetadata
      type: object
    ReportScore:
      description: Aggregate confidence over the signals in the report.
      properties:
        categories:
          additionalProperties:
            type: number
          title: Categories
          type: object
        collection_health:
          additionalProperties: true
          title: Collection Health
          type: object
        confidence_interval:
          additionalProperties: true
          title: Confidence Interval
          type: object
        cross_source_signals:
          title: Cross Source Signals
          type: integer
        overall_confidence:
          maximum: 1.0
          minimum: 0.0
          title: Overall Confidence
          type: number
        signal_count:
          minimum: 0.0
          title: Signal Count
          type: integer
        source_diversity:
          title: Source Diversity
          type: integer
      required:
      - overall_confidence
      - signal_count
      title: ReportScore
      type: object
    ReportSections:
      description: The report body.
      properties:
        executive_summary:
          $ref: '#/components/schemas/ExecutiveSummary'
        hiring_signals:
          $ref: '#/components/schemas/SignalSection'
        market_trends:
          $ref: '#/components/schemas/SignalSection'
        org_briefing:
          $ref: '#/components/schemas/OrgBriefing'
        talent_signals:
          $ref: '#/components/schemas/SignalSection'
      required:
      - executive_summary
      - market_trends
      - talent_signals
      - hiring_signals
      title: ReportSections
      type: object
    SignalItem:
      description: 'One signal in a report section.


        ``confidence`` and ``evidence`` are present on plans that include them

        and absent on the expired-trial preview.'
      properties:
        category:
          description: Signal category, for example market_trend, research_paper, talent or hiring_signal.
          title: Category
          type: string
        company:
          title: Company
          type: string
        confidence:
          title: Confidence
          type: number
        detail:
          title: Detail
          type: string
        entity_key:
          title: Entity Key
          type: string
        entity_type:
          title: Entity Type
          type: string
        evidence:
          additionalProperties: true
          description: The source metadata behind the counts, as collected.
          title: Evidence
          type: object
        example_headline:
          title: Example Headline
          type: string
        hiring_status:
          title: Hiring Status
          type: string
        relevance:
          title: Relevance
          type: number
        source:
          description: Source ids that observed the signal, comma-separated.
          title: Source
          type: string
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        title:
          title: Title
          type: string
        url:
          title: Url
          type: string
        velocity:
          additionalProperties: true
          description: Week-over-week movement of the signal.
          title: Velocity
          type: object
      required:
      - source
      - title
      - detail
      - category
      - timestamp
      title: SignalItem
      type: object
    SignalSection:
      description: A section of signals, capped by the plan.
      properties:
        count:
          description: Number of items in data.
          minimum: 0.0
          title: Count
          type: integer
        data:
          items:
            $ref: '#/components/schemas/SignalItem'
          title: Data
          type: array
        title:
          title: Title
          type: string
      required:
      - title
      - count
      - data
      title: SignalSection
      type: object
    SnapshotSummary:
      properties:
        generated_at:
          format: date-time
          title: Generated At
          type: string
        signal_count:
          title: Signal Count
          type: integer
        snapshot_id:
          description: YYYYMMDDTHHmm
          pattern: ^\d{8}T\d{4}$
          title: Snapshot Id
          type: string
      required:
      - snapshot_id
      - generated_at
      - signal_count
      title: SnapshotSummary
      type: object
    SpikeAlert:
      description: A watched topic grew past the spike threshold against its baseline.
      properties:
        change_pct:
          title: Change Pct
          type: number
        current_mentions:
          title: Current Mentions
          type: integer
        sources:
          description: Number of independent sources that observed it.
          title: Sources
          type: integer
        topic:
          title: Topic
          type: string
        type:
          const: spike
          title: Type
          type: string
      required:
      - type
      - topic
      - change_pct
      - current_mentions
      - sources
      title: SpikeAlert
      type: object
    StaleDataDetail:
      description: Why a report was refused as too old to serve.
      properties:
        data_age_hours:
          description: Age of the newest collected data, in hours.
          title: Data Age Hours
          type: number
        error:
          const: data_too_stale
          title: Error
          type: string
        message:
          title: Message
          type: string
        threshold_hours:
          description: The ceiling the operation enforces, in hours.
          title: Threshold Hours
          type: number
      required:
      - error
      - message
      - data_age_hours
      - threshold_hours
      title: StaleDataDetail
      type: object
    StaleDataError:
      description: 'The 503 an operation returns rather than serve intelligence older than

        its freshness ceiling. The same envelope as every error, with a structured

        ``error.message``, sent with a ``Retry-After`` header.'
      properties:
        error:
          $ref: '#/components/schemas/StaleDataErrorDetail'
        metadata:
          $ref: '#/components/schemas/ErrorMetadata'
        status:
          const: error
          title: Status
          type: string
      required:
      - status
      - error
      - metadata
      title: StaleDataError
      type: object
    StaleDataErrorDetail:
      properties:
        code:
          const: HTTP_ERROR
          title: Code
          type: string
        details:
          additionalProperties: true
          title: Details
          type: object
        http_status:
          const: 503
          title: Http Status
          type: integer
        message:
          $ref: '#/components/schemas/StaleDataDetail'
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
      required:
      - message
      - code
      - http_status
      - request_id
      - details
      title: StaleDataErrorDetail
      type: object
    TrendAnalysis:
      description: 'Week-over-week movement across the retained collection history.

        ``status`` is ``insufficient_history`` until there is history to compare.'
      properties:
        analysis_timestamp:
          title: Analysis Timestamp
          type: string
        declining:
          items:
            $ref: '#/components/schemas/TrendMovement'
          title: Declining
          type: array
        emerging:
          items:
            $ref: '#/components/schemas/TrendMovement'
          title: Emerging
          type: array
        engine:
          title: Engine
          type: string
        hot_memory:
          additionalProperties: true
          title: Hot Memory
          type: object
        silent_but_rising:
          items:
            $ref: '#/components/schemas/TrendMovement'
          title: Silent But Rising
          type: array
        snapshot_count:
          title: Snapshot Count
          type: integer
        spikes:
          items:
            $ref: '#/components/schemas/TrendMovement'
          title: Spikes
          type: array
        status:
          description: ok, or insufficient_history before any history exists.
          title: Status
          type: string
        summary:
          title: Summary
          type: string
        tracking_stats:
          additionalProperties:
            type: integer
          title: Tracking Stats
          type: object
        velocity:
          items:
            $ref: '#/components/schemas/TrendMovement'
          title: Velocity
          type: array
        weeks_of_data:
          title: Weeks Of Data
          type: number
      required:
      - status
      title: TrendAnalysis
      type: object
    TrendMovement:
      description: A topic's movement against its own history.
      properties:
        baseline_is_partial:
          title: Baseline Is Partial
          type: boolean
        baseline_metric:
          title: Baseline Metric
          type: number
        category:
          title: Category
          type: string
        change_pct:
          anyOf:
          - type: number
          - type: 'null'
          description: Null when there is no baseline yet.
          title: Change Pct
        current_confidence:
          title: Current Confidence
          type: number
        current_mentions:
          title: Current Mentions
          type: integer
        current_metric:
          title: Current Metric
          type: number
        current_sources:
          title: Current Sources
          type: integer
        last_confidence:
          title: Last Confidence
          type: number
        last_seen_days_ago:
          title: Last Seen Days Ago
          type: integer
        metric_kind:
          title: Metric Kind
          type: string
        metric_trend:
          title: Metric Trend
          type: string
        presence:
          title: Presence
          type: string
        sources_list:
          items:
            type: string
          title: Sources List
          type: array
        spike_magnitude:
          title: Spike Magnitude
          type: number
        status:
          title: Status
          type: string
        topic:
          title: Topic
          type: string
        tracked_days:
          title: Tracked Days
          type: integer
        tracked_days_before:
          title: Tracked Days Before
          type: integer
      required:
      - topic
      - category
      title: TrendMovement
      type: object
    UsageEvent:
      properties:
        endpoint:
          title: Endpoint
          type: string
        status_code:
          title: Status Code
          type: integer
        timestamp:
          anyOf:
          - type: string
          - type: 'null'
          format: date-time
          title: Timestamp
      required:
      - endpoint
      - status_code
      - timestamp
      title: UsageEvent
      type: object
    UsageLog:
      description: The request log of the API key used on the call, newest first.
      properties:
        org_name:
          title: Org Name
          type: string
        total_returned:
          title: Total Returned
          type: integer
        usage:
          items:
            $ref: '#/components/schemas/UsageEvent'
          title: Usage
          type: array
      required:
      - org_name
      - total_returned
      - usage
      title: UsageLog
      type: object
    ValidationIssue:
      description: One problem with the request, as a 422 lists it in ``error.details``.
      properties:
        ctx:
          description: The constraint that failed, as text.
          title: Ctx
          type: string
        input:
          title: Input
        loc:
          description: Where the problem is, for example ['query', 'limit'].
          items:
            anyOf:
            - type: string
            - type: integer
          title: Loc
          type: array
        msg:
          title: Msg
          type: string
        type:
