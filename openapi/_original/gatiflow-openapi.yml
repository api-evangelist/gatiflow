  /api/v1/public/deep-dive:
    get:
      description: 'Returns the opening preview of the most recent Deep Dive article, plus its topic, title, word count and
        publication date. No authentication is required.


        The full text is not served here. It stays behind authentication on the Deep Dive product page and is included with
        Starter, Pro and Business.


        Deep Dive articles are written by a language model from the collected signals, which the response declares. When nothing
        has been published yet the endpoint returns 200 with status set to no_article rather than an error.


        Because the operation takes no credential there is no key to meter, so the ceiling is per caller address: 60 requests
        a minute, above which the endpoint returns 429. The article changes once a week, so a caller that polls has nothing
        to gain from a shorter interval.'
      operationId: get_latest_deep_dive_api_v1_public_deep_dive_get
      responses:
