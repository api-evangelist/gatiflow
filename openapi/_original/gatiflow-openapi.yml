  /api/v1/intelligence/report:
    get:
      description: 'Runs a report for the calling organization over the most recent collection cycle and returns it as JSON.
        Every signal carries its sources, a mention count and a confidence score, and on plans that include evidence, the
        raw evidence behind that count.


        Signal caps per plan: Starter 15, Pro 40, Business 100. An expired trial falls back to a watermarked 3-signal preview
        with confidence and evidence removed.


        Results are filtered to the topics configured on the organization profile. A successful call consumes one unit of
        the daily quota; a failed generation refunds it. If the underlying data is older than 24 hours the endpoint returns
        503 with a Retry-After header rather than serving stale intelligence.


        The schema_version query parameter selects the shape of the contract block, not the version of the payload: 1.1 and
        1.2 both return the full contract with capabilities and limits, while the default 1.0 returns the compact one. The
        response reports the schema it actually is, at the top level and inside the contract, and the two always agree.'
      operationId: report_api_v1_intelligence_report_get
