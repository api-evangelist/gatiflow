info:
  contact:
    email: support@gatiflow.io
    name: GatiFlow Support
    url: https://gatiflow.io/api-docs
  description: 'Customer-facing GatiFlow Intelligence API. Authenticate with an API key in the `X-API-Key` header.


    Rate limits and daily quotas are per plan. `GET /api/v1/intelligence/report`, `GET /api/v1/intelligence/report/export`
    return both `X-RateLimit-*` and `X-DailyQuota-*` response headers. `GET /api/v1/intelligence/report-history`, `GET /api/v1/intelligence/report/at/{snapshot_id}`
    return `X-RateLimit-*` alone: they are rate limited and consume no quota. The remaining operations are metered without
    reporting a header, so read the figures from `GET /api/v1/usage` or from the plan. The operation that takes no credential
    is capped per caller address instead, and states its own ceiling.


    ## What people use it for


    **You own an API and want to know what your sector is doing** -- `GET /api/v1/intelligence/report` returns the week filtered
    to the topics on your organization profile, and its `trend_analysis` block carries the movement (`velocity`, `spikes`,
    `emerging`, `declining`) instead of a feed you have to read. A daily call is enough: rather than serve intelligence older
    than 24 hours the endpoint returns 503 with `Retry-After`.


    **You built the product and marketing is the part you are worst at** -- `sections.market_trends` and the `emerging` list
    in `GET /api/v1/intelligence/report` name the topics your buyers are already reading about, so a post has a subject before
    it has a deadline. `GET /api/v1/public/deep-dive` returns the preview of the current long-form article with no API key,
    so you can see the treatment before you pay for it.


    **You want the signals inside the tools your team already uses** -- `GET /api/v1/intelligence/report/export` returns the
    same report as a file for a warehouse load or a weekly deck: CSV on Pro, CSV or PDF on Business. `GET /api/v1/intelligence/report-history`
    and `GET /api/v1/intelligence/report/at/{snapshot_id}` walk the snapshots your plan retains, so a dashboard starts with
    history instead of one row, and `GET /api/v1/usage` shows every call a scheduled job made without a second log.'
