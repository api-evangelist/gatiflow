            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The organization has no subscription, or the subscription is not active.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The organization is inactive, its owner's email address is still unverified after the three-day grace period, or the key lacks the intelligence:read scope.
        '422':
          content:
            application/json:
