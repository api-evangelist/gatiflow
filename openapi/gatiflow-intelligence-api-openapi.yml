  /api/v1/intelligence/report-history:
    get:
      description: 'Lists the report snapshots retained for this organization, newest first. Snapshots are written by the collection cycle, not by report calls, so this list reflects what was actually collected. Each entry carries a snapshot_id in the YYYYMMDDTHHmm format, which is what GET /intelligence/report/at/{snapshot_id} expects.


        Retention follows the plan: Starter keeps 7 days, Pro keeps 90 days, Business keeps 365 days. An expired trial retains nothing and receives an empty list.


        This endpoint returns metadata only and does not consume daily quota, but it does count against the plan per-minute rate limit.'
      operationId: report_history_list_api_v1_intelligence_report_history_get
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 20
          maximum: 50
          minimum: 1
          title: Limit
          type: integer
      - in: header
        name: X-API-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          content:
            application/json:
              examples:
                empty:
                  description: Returned for an expired trial, which retains nothing.
                  summary: No retained snapshots
                  value:
                    count: 0
                    plan: free
                    retention_days: 0
                    snapshots: []
                pro:
                  summary: Two snapshots on a Pro key
                  value:
                    count: 2
                    plan: pro
                    retention_days: 90
                    snapshots:
                    - generated_at: '2026-09-03T06:00:11.482913+00:00'
                      signal_count: 38
