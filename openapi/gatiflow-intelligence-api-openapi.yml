  /api/v1/intelligence/report/export:
    get:
      description: 'Returns the same report as GET /intelligence/report, serialized to a downloadable file instead of JSON. The response body is the file itself, with a Content-Disposition attachment header and a dated filename.


        Export formats follow the plan: Starter has none and receives 403, Pro can export CSV, Business can export CSV and PDF.


        A successful export consumes one unit of the daily quota, the same as a report call. If the underlying data is older than 24 hours the endpoint returns 503 with a Retry-After header.'
      operationId: export_report_api_v1_intelligence_report_export_get
      parameters:
      - in: query
        name: format
        required: false
        schema:
          default: csv
          pattern: ^(csv|pdf)$
          title: Format
          type: string
      - in: header
        name: X-API-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          content:
            application/pdf:
              schema:
                format: binary
                type: string
            text/csv:
              example: 'section,title,detail,source,category,confidence,url,timestamp

                market_trends,rust,Strength: high | Mentions: 16,"hackernews,arxiv",market_trend,0.91,https://news.ycombinator.com/item?id=41234567,2026-09-03T06:00:11.482913+00:00

                talent_signals,''@octodev,"Senior Rust engineer, 8 public repositories this quarter",github,talent,0.82,https://github.com/octodev,2026-09-03T06:00:11.482913+00:00

                hiring_signals,Series B infrastructure hiring,Backend openings up week over week,hiring,hiring_signal,0.77,,2026-09-03T06:00:11.482913+00:00

                '
              schema:
                format: binary
                type: string
          description: The report as a file attachment. Content-Type follows the requested format.
          headers:
            X-DailyQuota-Limit:
              description: Calls the plan allows per day.
              schema:
                minimum: 0
                type: integer
            X-DailyQuota-Remaining:
              description: Calls left in today's quota.
              schema:
                minimum: 0
                type: integer
            X-RateLimit-Limit:
              description: Requests the plan allows in one rate-limit window.
              schema:
                minimum: 0
                type: integer
            X-RateLimit-Remaining:
              description: Requests left in the current window.
              schema:
                minimum: 0
                type: integer
            X-RateLimit-Reset-Seconds:
              description: Length of the sliding window, in seconds. A request refused with 429 succeeds once this many seconds have passed.
              schema:
                minimum: 0
                type: integer
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The X-API-Key header is missing, or the key is unknown, revoked or expired.
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The organization has no subscription, or the subscription is not active.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The plan does not include the requested export format, the organization is inactive, its owner's email address is still unverified after the three-day grace period, or the key lacks the intelligence:read scope.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: A parameter is missing, malformed or out of range. error.details lists each problem.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'The plan''s per-minute rate limit or daily quota is exhausted. error.message says which: Rate limit exceeded, or Daily quota exceeded.'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaleDataError'
          description: The underlying data is older than 24 hours. Sent with a Retry-After header, in seconds.
          headers:
            Retry-After:
              description: Seconds to wait before asking again.
              schema:
                minimum: 0
                type: integer
      security:
      - ApiKeyAuth: []
      summary: Export the report as a file
      tags:
      - intelligence
components:
  schemas:
    StaleDataError:
      description: 'The 503 an operation returns rather than serve intelligence older than

        its freshness ceiling. The same envelope as every error, with a structured

        ``error.message``, sent with a ``Retry-After`` header.'
      properties:
        error:
          $ref: '#/components/schemas/StaleDataErrorDetail'
        metadata:
          $ref: '#/components/schemas/ErrorMetadata'
        status:
          const: error
          title: Status
          type: string
      required:
      - status
      - error
      - metadata
      title: StaleDataError
      type: object
    ErrorDetail:
      description: What went wrong, and the id to quote when asking about it.
      properties:
        code:
          description: NOT_FOUND for a 404, VALIDATION_ERROR for a 422, HTTP_ERROR for every other refusal.
          enum:
          - HTTP_ERROR
          - NOT_FOUND
          - VALIDATION_ERROR
          - INTERNAL_ERROR
          title: Code
          type: string
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - items:
              $ref: '#/components/schemas/ValidationIssue'
            type: array
          description: The list of problems on a 422; an empty object otherwise.
          title: Details
        http_status:
          title: Http Status
          type: integer
        message:
          description: Why the request was refused, in plain words.
          title: Message
          type: string
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          description: Also sent as the X-Request-ID response header.
          title: Request Id
      required:
      - message
      - code
      - http_status
      - request_id
      - details
      title: ErrorDetail
      type: object
    ErrorMetadata:
      properties:
        provider:
          title: Provider
          type: string
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        version:
          title: Version
          type: string
      required:
      - timestamp
      - provider
      - version
      title: ErrorMetadata
      type: object
    StaleDataErrorDetail:
      properties:
        code:
          const: HTTP_ERROR
          title: Code
          type: string
        details:
          additionalProperties: true
          title: Details
          type: object
        http_status:
          const: 503
          title: Http Status
          type: integer
        message:
          $ref: '#/components/schemas/StaleDataDetail'
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
      required:
      - message
      - code
      - http_status
      - request_id
      - details
      title: StaleDataErrorDetail
      type: object
    ErrorResponse:
      description: Every refusal the API returns, whatever its status.
