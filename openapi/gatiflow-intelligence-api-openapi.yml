          description: A parameter is missing, malformed or out of range. error.details lists each problem.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'The plan''s per-minute rate limit is exhausted: error.message is Rate limit exceeded.'
