                    - generated_at: '2026-09-02T06:00:09.117204+00:00'
                      signal_count: 35
                      snapshot_id: 20260902T0600
              schema:
                $ref: '#/components/schemas/ReportHistory'
          description: Snapshot metadata for this organization, newest first.
          headers:
            X-RateLimit-Limit:
              description: Requests the plan allows in one rate-limit window.
              schema:
                minimum: 0
                type: integer
            X-RateLimit-Remaining:
              description: Requests left in the current window.
              schema:
                minimum: 0
                type: integer
            X-RateLimit-Reset-Seconds:
              description: Length of the sliding window, in seconds. A request refused with 429 succeeds once this many seconds have passed.
